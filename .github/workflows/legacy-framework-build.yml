name: .NET Framework Release pipeline
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    name: Build, test and verify packages (Release)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: microsoft/setup-msbuild@v3
      - name: Test release artifact guards
        shell: pwsh
        run: python -m unittest discover -s build -p test_verify_release.py -v
      - uses: NuGet/setup-nuget@v3
        with:
          nuget-version: '6.14.0'
      - name: Ensure CLR 2.0 is available
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $feature = Get-WindowsFeature NET-Framework-Core
          if (-not $feature.Installed) {
            $result = Install-WindowsFeature NET-Framework-Core
            if (-not $result.Success -or $result.RestartNeeded -eq 'Yes') {
              throw 'CLR 2.0 installation failed or requires a restart.'
            }
          }
      # .NET 10 runs Cake; VS MSBuild/Roslyn compile against the restored net20 reference assemblies.
      # No .NET 4.x retargeting or Mono runtime substitution is used.
      - name: Build, test and verify packages through Cake.Frosting
        shell: pwsh
        run: ./build/build.ps1 --target="Verify Consumer" --configuration=Release
      - name: Verify the release artifact handoff without publishing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item artifacts/release-check -ItemType Directory -Force | Out-Null
          Copy-Item artifacts/packages/Release/* artifacts/release-check/
          Copy-Item artifacts/consumer/validation.json artifacts/release-check/consumer-validation.json
          Set-Content artifacts/release-check/release-notes.md 'CI validation only; no publication.'
          $report = Get-Content artifacts/release-check/validation.json -Raw | ConvertFrom-Json
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build/verify_release.py artifacts/release-check "v$($report.PackageVersion)" $commit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify CLR 2.0 assembly metadata
        shell: pwsh
        run: |
          $dll = "src/DotNetFrameworkToolkit/bin/Release/net20/DotNetFrameworkToolkit.dll"
          $env:TOOLKIT_ASSEMBLY = (Resolve-Path $dll).Path
          powershell -NoProfile -Command '$assembly = [Reflection.Assembly]::ReflectionOnlyLoadFrom($env:TOOLKIT_ASSEMBLY); if ($assembly.ImageRuntimeVersion -ne "v2.0.50727") { throw "Unexpected runtime: $($assembly.ImageRuntimeVersion)" }; Write-Host $assembly.ImageRuntimeVersion'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        with:
          name: net20-Release
          path: src/DotNetFrameworkToolkit/bin/Release/net20/
          if-no-files-found: error
      - name: Upload validated packages
        uses: actions/upload-artifact@v6
        with:
          name: nuget-Release
          path: artifacts/packages/Release/
          if-no-files-found: error
      - name: Upload generated images
        uses: actions/upload-artifact@v6
        with:
          name: images-Release
          path: |
            content/*.png
            content/*.ico
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-Release
          path: artifacts/test-results/Release/
          if-no-files-found: warn
      - name: Upload consumer verification
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: consumer-Release
          path: |
            artifacts/consumer/*.log
            artifacts/consumer/validation.json
          if-no-files-found: warn
