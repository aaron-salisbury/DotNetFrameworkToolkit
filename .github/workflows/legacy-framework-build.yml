name: .NET Framework Release pipeline
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    name: Build, test and verify packages (Release)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: microsoft/setup-msbuild@v3
      - uses: NuGet/setup-nuget@v3
        with:
          nuget-version: '6.14.0'
      # .NET 10 runs Cake; VS MSBuild/Roslyn compile against the restored net20 reference assemblies.
      # No .NET 4.x retargeting or Mono runtime substitution is used.
      - name: Build, test and verify packages through Cake.Frosting
        shell: pwsh
        run: ./build/build.ps1 --target="Verify Package" --configuration=Release
      - name: Verify CLR 2.0 assembly metadata
        shell: pwsh
        run: |
          $dll = "src/DotNetFrameworkToolkit/bin/Release/net20/DotNetFrameworkToolkit.dll"
          $env:TOOLKIT_ASSEMBLY = (Resolve-Path $dll).Path
          powershell -NoProfile -Command '$assembly = [Reflection.Assembly]::ReflectionOnlyLoadFrom($env:TOOLKIT_ASSEMBLY); if ($assembly.ImageRuntimeVersion -ne "v2.0.50727") { throw "Unexpected runtime: $($assembly.ImageRuntimeVersion)" }; Write-Host $assembly.ImageRuntimeVersion'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        with:
          name: net20-Release
          path: src/DotNetFrameworkToolkit/bin/Release/net20/
          if-no-files-found: error
      - name: Upload validated packages
        uses: actions/upload-artifact@v6
        with:
          name: nuget-Release
          path: artifacts/packages/Release/
          if-no-files-found: error
      - name: Upload generated images
        uses: actions/upload-artifact@v6
        with:
          name: images-Release
          path: |
            content/*.png
            content/*.ico
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-Release
          path: artifacts/test-results/Release/
          if-no-files-found: warn
